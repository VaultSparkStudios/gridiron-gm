name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/scouting-overhaul
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "index.html"
      - "vite.config.js"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Served from this fork's Pages site: https://evandamours.github.io/27_Gridiron_GM/
      VITE_APP_BASE_PATH: /27_Gridiron_GM/
      VITE_GAME_SERVICE_ORIGIN: ${{ vars.GAME_SERVICE_ORIGIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Pages bundle
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
